version: '3'

services:

  bentopdf:
    image: bentopdf/bentopdf:latest
    container_name: local-bentopdf
    ports:
      - ${BENTOPDF_PORT:-8080}:8080
    environment:
      # Modo Simples (interface mais limpa, apenas ferramentas essenciais)
      - SIMPLE_MODE=${BENTOPDF_SIMPLE_MODE:-false}
      
      # Configurações de timezone
      - TZ=America/Sao_Paulo
      
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
